  <body>
    <div id="app"></div>
    <script>
      // 早期错误捕获（开发诊断）：模块脚本执行前的报错也能收到
      window.__errs = [];
      window.addEventListener('error', function (e) {
        window.__errs.push('E: ' + e.message + ' @ ' + (e.filename || '').slice(-40) + ':' + e.lineno);
      });
      window.addEventListener('unhandledrejection', function (e) {
        window.__errs.push('P: ' + String(e.reason && e.reason.stack ? e.reason.stack : e.reason).slice(0, 400));
      });
    </script>
    <script type="module" src="/src/main.ts"></script>
